name: Actualizar tasas
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Construir rates.json
        run: node build-rates.mjs
      - name: Commit si cambio
        run: |
          if [ -n "$(git status --porcelain rates.json)" ]; then
            git config user.name "rates-bot"
            git config user.email "actions@users.noreply.github.com"
            git add rates.json
            git commit -m "tasas: actualizacion automatica $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en las tasas."
          fi
